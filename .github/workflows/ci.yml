name: Quality gate

on:
  push:
    branches: [main]
  pull_request:
  # Un commit poussé avec le GITHUB_TOKEN ne déclenche aucun workflow — c'est la garde anti-boucle de GitHub. Les
  # workflows de données commitent pourtant les fichiers que le déploiement sert : sans ce déclencheur manuel,
  # qu'ils appellent en fin de course, ni la quality gate ni la mise en ligne ne voyaient jamais leur commit.
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:unit
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
