name: Enrich TMDb catalogue

# Le catalogue publié se rafraîchit par lots, et le commit qui en résulte repart dans le circuit ordinaire :
# quality gate sur main, puis déploiement Cloud Run. Ce workflow n'a donc rien à publier lui-même.

on:
  workflow_dispatch:
    inputs:
      batch_size:
        description: Number of local people to enrich or refresh
        required: true
        default: "100"
        type: string
      only_missing_kinds:
        description: Only re-fetch people whose catalogue entries have no work kind yet
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "17 3 * * 0"

permissions:
  contents: write

concurrency:
  group: tmdb-enrichment
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check TMDb secret
        env:
          TMDB_API_TOKEN: ${{ secrets.TMDB_API_TOKEN }}
        run: test -n "$TMDB_API_TOKEN" || { echo "Repository secret TMDB_API_TOKEN is missing."; exit 1; }
      - name: Enrich a resumable batch
        env:
          TMDB_API_TOKEN: ${{ secrets.TMDB_API_TOKEN }}
          BATCH_SIZE: ${{ inputs.batch_size || '100' }}
          ONLY_MISSING_KINDS: ${{ inputs.only_missing_kinds && '--only-missing-kinds' || '' }}
        run: npm run sync:tmdb -- --limit="$BATCH_SIZE" --refresh-days=60 --output=src/data/tmdb-overlay.json $ONLY_MISSING_KINDS
      - name: Run non-regression tests
        run: npm run test:unit
      - name: Persist refreshed overlay
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/tmdb-overlay.json
          if git diff --cached --quiet; then
            echo "Catalogue already current."
          else
            git commit -m "Refresh TMDb catalogue overlay"
            git push
          fi
